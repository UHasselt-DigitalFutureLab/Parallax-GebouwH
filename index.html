<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>PlayCanvas App</title>
  </head>
  <body>
    <!-- Display mode navigation -->
    <nav id="mode-menu" aria-label="Display mode">
      <button id="mode-menu-button" type="button"></button>
    </nav>

    <!-- UI Dropdown Container -->
    <div id="ui-container">
      <!-- Hidden by default, shown if sceneData has viewpoints -->
      <select id="viewpoint-select" class="styled-select hidden"></select>
      <select id="render-select" class="styled-select hidden"></select>
    </div>

    <!-- Logos -->
    <div id="top-right-logo-container"></div>

    <!-- Boot the App -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
